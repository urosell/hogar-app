<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- interactive-widget=resizes-content: al abrirse el teclado el viewport se
         encoge de verdad, en vez de quedarse igual con el teclado tapando la parte
         de abajo. Así las unidades dvh y los elementos anclados abajo (BottomNav,
         hojas modales) respetan el espacio libre real. Android/Chrome lo aplica;
         iOS lo ignora y sigue con su propio comportamiento. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#1E2718" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hogar" />
    <meta name="description" content="Tareas de casa, lista de la compra y contador de gym para dos." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Hogar</title>
    <!-- Aplica el tema guardado antes de pintar, para evitar parpadeo -->
    <script>
      try {
        var t = localStorage.getItem('tema')
        if (t === 'day') {
          document.documentElement.setAttribute('data-theme', 'day')
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', '#CADFBC')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
